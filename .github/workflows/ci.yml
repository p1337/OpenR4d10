name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install renderer dependency
        run: python -m pip install "Pillow>=11,<13"
      - name: Python tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Installer syntax
        run: >-
          bash -n bootstrap.sh install.sh boot/install.sh
          boot/initramfs/hooks/openr4d10-boot
          boot/initramfs/scripts/init-top/openr4d10-boot
      - name: Read-only installer check
        run: bash install.sh --check --allow-unsupported
      - name: Git-free bootstrap smoke test
        run: bash bootstrap.sh --check --allow-unsupported
      - name: Exact online one-liner smoke test
        run: curl -fsSL https://raw.githubusercontent.com/p1337/OpenR4d10/main/bootstrap.sh | sudo bash -s -- --check --allow-unsupported
