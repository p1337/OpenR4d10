<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1500" viewBox="0 0 1600 1500" role="img" aria-labelledby="title description">
  <title id="title">OpenR4d10 Dienst- und Bedienmatrix</title>
  <desc id="description">Übersicht der implementierten Dienste und ihrer Abweichungen von der einheitlichen Grundbelegung.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061112"/><stop offset="1" stop-color="#102a2a"/></linearGradient>
    <style>
      text{font-family:Inter,"DejaVu Sans",Arial,sans-serif;fill:#edf7f4}.accent{fill:#fdb813}.green{fill:#41dc8e}.muted{fill:#91aaa6}.card{fill:#0a1718;stroke:#294142;stroke-width:2}.ready{fill:#10211e;stroke:#2f7660;stroke-width:2}.h1{font-size:50px;font-weight:800}.h2{font-size:27px;font-weight:800}.body{font-size:19px}.small{font-size:16px}.tag{font-size:15px;font-weight:800;letter-spacing:1.5px}
    </style>
  </defs>
  <rect width="1600" height="1500" fill="url(#bg)"/>
  <text x="60" y="74" class="h1">OPENR4D10 · DIENSTMATRIX</text>
  <text x="62" y="112" class="body muted">Grundregel: links Lautstärke/Sekundärfunktion · rechts Dienst/Kanal/Auswahl · PTT Kontext oder Zurück</text>
  <rect x="60" y="145" width="1480" height="92" rx="24" class="ready"/>
  <text x="88" y="180" class="tag accent">IMMER GLEICH</text>
  <text x="88" y="215" class="body">Power kurz = Hauptmenü · Rechts außen = Eintrag · Rechts innen = Dienst · Rechts Klick = Auswahl/Play · PTT im Menü = Zurück</text>

  <g transform="translate(60 270)">
    <rect width="470" height="190" rx="24" class="card"/><text x="25" y="42" class="tag accent">SYSTEM</text><text x="25" y="78" class="h2">Status &amp; Einstellungen</text><text x="25" y="112" class="body">Diagnose, WLAN, Akku, Updates</text><text x="25" y="146" class="small muted">Kein Play · kein Medienbild</text><text x="25" y="173" class="small green">Gerät + Browser</text>
  </g>
  <g transform="translate(565 270)">
    <rect width="470" height="190" rx="24" class="card"/><text x="25" y="42" class="tag accent">WEBRADIO</text><text x="25" y="78" class="h2">Sender &amp; Liedaufnahme</text><text x="25" y="112" class="body">CH Sender · Klick Play/Pause</text><text x="25" y="146" class="small muted">PTT Lied behalten · doppelt Daueraufnahme</text><text x="25" y="173" class="small green">Gerät + Browser</text>
  </g>
  <g transform="translate(1070 270)">
    <rect width="470" height="190" rx="24" class="card"/><text x="25" y="42" class="tag accent">WETTER</text><text x="25" y="78" class="h2">Radar &amp; Satellit</text><text x="25" y="112" class="body">CH Bild · Klick öffnen/aktualisieren</text><text x="25" y="146" class="small muted">Übernimmt niemals Audio</text><text x="25" y="173" class="small green">Gerät + Browser</text>
  </g>

  <g transform="translate(60 490)">
    <rect width="470" height="190" rx="24" class="card"/><text x="25" y="42" class="tag accent">AMBIENTR4D10</text><text x="25" y="78" class="h2">Klanglandschaften</text><text x="25" y="112" class="body">CH Szene startet sofort</text><text x="25" y="146" class="small muted">Klick 2 s: Ebenen · innen links Pegel</text><text x="25" y="173" class="small green">Gerät + Browser</text>
  </g>
  <g transform="translate(565 490)">
    <rect width="470" height="190" rx="24" class="card"/><text x="25" y="42" class="tag accent">LOKALE MEDIEN</text><text x="25" y="78" class="h2">Musik &amp; Aufnahmen</text><text x="25" y="112" class="body">PLAYER · CH Eintrag · Klick Play</text><text x="25" y="146" class="small muted">Favoriten, Shuffle, Soundmix im Browser</text><text x="25" y="173" class="small green">Player + Browser-Verwaltung</text>
  </g>
  <g transform="translate(1070 490)">
    <rect width="470" height="190" rx="24" class="card"/><text x="25" y="42" class="tag accent">PODCASTS</text><text x="25" y="78" class="h2">Abos &amp; Folgen</text><text x="25" y="112" class="body">Folge läuft im gemeinsamen PLAYER</text><text x="25" y="146" class="small muted">Abo, Suche und Auswahl im Browser</text><text x="25" y="173" class="small green">Player + Browser-Verwaltung</text>
  </g>

  <g transform="translate(60 710)">
    <rect width="470" height="220" rx="24" class="card"/><text x="25" y="42" class="tag accent">MEDIATHEKEN</text><text x="25" y="78" class="h2">ARD · ZDF · Öffentlich</text><text x="25" y="112" class="body">CH Beitrag · Klick Play/Pause</text><text x="25" y="146" class="small muted">Innen links 15 s/1 min spulen</text><text x="25" y="174" class="small muted">PTT Favorit · 2 s Gruppen</text><text x="25" y="202" class="small green">Gerätevideo/Audio + Browser</text>
  </g>
  <g transform="translate(565 710)">
    <rect width="470" height="220" rx="24" class="card"/><text x="25" y="42" class="tag accent">BRANDMEISTER</text><text x="25" y="78" class="h2">DMR HoseLine · nur Empfang</text><text x="25" y="112" class="body">CH 1 TG · innen links 25 TG</text><text x="25" y="146" class="small muted">Klick Empfang · PTT TG an/aus</text><text x="25" y="174" class="small muted">PTT 2 s Länderfilter · max. 6 aktiv</text><text x="25" y="202" class="small green">Gerät + Browser</text>
  </g>
  <g transform="translate(1070 710)">
    <rect width="470" height="220" rx="24" class="card"/><text x="25" y="42" class="tag accent">SPRACHAUFZEICHNUNG</text><text x="25" y="78" class="h2">Stereo Voice Recorder</text><text x="25" y="112" class="body">PTT halten = sofort aufnehmen</text><text x="25" y="146" class="small muted">Rechts außen 1 s · links außen 0,1 s</text><text x="25" y="174" class="small muted">Innen links Anfang/Ende · Klick Play</text><text x="25" y="202" class="small green">Exklusiver Audio-Dienst</text>
  </g>

  <g transform="translate(60 960)">
    <rect width="470" height="190" rx="24" class="card"/><text x="25" y="42" class="tag accent">RSS / ATOM</text><text x="25" y="78" class="h2">Nachrichtenfeeds</text><text x="25" y="112" class="body">Quellen und letzte Meldungen</text><text x="25" y="146" class="small muted">Noch keine native Geräteansicht</text><text x="25" y="173" class="small green">Heute: Browser</text>
  </g>
  <g transform="translate(565 960)">
    <rect width="470" height="190" rx="24" class="card"/><text x="25" y="42" class="tag accent">WEBCAMS</text><text x="25" y="78" class="h2">Snapshot · MJPEG · RTSP</text><text x="25" y="112" class="body">Geprüfte, begrenzte Bildquellen</text><text x="25" y="146" class="small muted">Noch keine native Geräteansicht</text><text x="25" y="173" class="small green">Heute: Browser</text>
  </g>
  <g transform="translate(1070 960)">
    <rect width="470" height="190" rx="24" class="card"/><text x="25" y="42" class="tag accent">HARDWARE</text><text x="25" y="78" class="h2">Whisplay + PiSugar 3</text><text x="25" y="112" class="body">LCD · 2 Mikrofone · Lautsprecher</text><text x="25" y="146" class="small muted">PTT · Power · RGB-LED ohne Funktion</text><text x="25" y="173" class="small green">Encoder logisch vorbereitet</text>
  </g>

  <rect x="60" y="1190" width="1480" height="210" rx="28" class="ready"/>
  <text x="90" y="1235" class="h2">SICHERHEITS- UND KONSISTENZREGELN</text>
  <text x="90" y="1276" class="body">• Ein Dienstwechsel stoppt laufendes Audio nicht. Erst Play in einer anderen Audio-App übernimmt den Lautsprecher.</text>
  <text x="90" y="1312" class="body">• Ausnahme: Sprachaufzeichnung stoppt beim Öffnen sofort alle Streams.</text>
  <text x="90" y="1348" class="body">• PTT bedeutet immer die physische Whisplay-Taste. BrandMeister sendet niemals.</text>
  <text x="90" y="1384" class="body">• Nicht verbundene Adapter sind Ausbauverträge, keine fertigen Dienste.</text>
  <text x="800" y="1460" text-anchor="middle" class="small muted">OpenR4d10 · skalierbare Dienstübersicht · Stand 0.10.107</text>
</svg>
