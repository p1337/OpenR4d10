  <rect x="52" y="338" width="476" height="648" rx="30" class="card"/>
  <text x="78" y="379" class="tag accent">VORNE · HEUTE VORHANDEN</text>
  <text x="78" y="413" class="h2">Whisplay HAT</text>
  <g transform="translate(167 442)">
    <rect x="0" y="0" width="246" height="480" rx="18" class="board"/>
