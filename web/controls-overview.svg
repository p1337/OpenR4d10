    <rect x="31" y="48" width="29" height="20" rx="4" fill="#b7c3c0"/><text x="46" y="83" text-anchor="middle" class="micro muted">MIC_L</text>
    <rect x="8" y="112" width="58" height="82" rx="8" fill="#d5dedb" stroke="#758784" stroke-width="2"/>
    <circle cx="37" cy="135" r="10" fill="#0b1516"/><circle cx="37" cy="171" r="10" fill="#0b1516"/>
