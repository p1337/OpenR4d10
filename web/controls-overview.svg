  <g>
    <circle cx="723" cy="500" r="12" fill="#fdb813"/><text x="723" y="506" text-anchor="middle" class="micro" fill="#071314">1</text>
    <circle cx="682" cy="602" r="12" fill="#fdb813"/><text x="682" y="608" text-anchor="middle" class="micro" fill="#071314">2</text>
