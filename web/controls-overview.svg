      <circle cx="205" cy="49" r="4"/><circle cx="216" cy="49" r="4"/><circle cx="205" cy="66" r="4"/><circle cx="216" cy="66" r="4"/><circle cx="205" cy="83" r="4"/><circle cx="216" cy="83" r="4"/><circle cx="205" cy="100" r="4"/><circle cx="216" cy="100" r="4"/><circle cx="205" cy="117" r="4"/><circle cx="216" cy="117" r="4"/><circle cx="205" cy="134" r="4"/><circle cx="216" cy="134" r="4"/><circle cx="205" cy="151" r="4"/><circle cx="216" cy="151" r="4"/><circle cx="205" cy="168" r="4"/><circle cx="216" cy="168" r="4"/><circle cx="205" cy="185" r="4"/><circle cx="216" cy="185" r="4"/><circle cx="205" cy="202" r="4"/><circle cx="216" cy="202" r="4"/><circle cx="205" cy="219" r="4"/><circle cx="216" cy="219" r="4"/><circle cx="205" cy="236" r="4"/><circle cx="216" cy="236" r="4"/><circle cx="205" cy="253" r="4"/><circle cx="216" cy="253" r="4"/><circle cx="205" cy="270" r="4"/><circle cx="216" cy="270" r="4"/><circle cx="205" cy="287" r="4"/><circle cx="216" cy="287" r="4"/><circle cx="205" cy="304" r="4"/><circle cx="216" cy="304" r="4"/><circle cx="205" cy="321" r="4"/><circle cx="216" cy="321" r="4"/><circle cx="205" cy="338" r="4"/><circle cx="216" cy="338" r="4"/><circle cx="205" cy="355" r="4"/><circle cx="216" cy="355" r="4"/><circle cx="205" cy="372" r="4"/><circle cx="216" cy="372" r="4"/>
