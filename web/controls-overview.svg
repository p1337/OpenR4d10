<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title description">
  <title id="title">OpenR4d10 Hardware-Komponenten und Bedienung</title>
  <desc id="description">Quellenbasierte Komponentenansicht des echten Whisplay-, Raspberry-Pi-Zero-2-W- und PiSugar-3-Stapels. Die noch nicht montierten Doppelencoder sind getrennt als Planung markiert.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071314"/><stop offset="1" stop-color="#0d2324"/></linearGradient>
    <linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172526"/><stop offset="1" stop-color="#071011"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#173336"/><stop offset="1" stop-color="#071112"/></linearGradient>
    <linearGradient id="pi" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2d7650"/><stop offset="1" stop-color="#173b2c"/></linearGradient>
    <linearGradient id="battery" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#32393a"/><stop offset="1" stop-color="#171c1d"/></linearGradient>
    <filter id="amberGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      text{font-family:Inter,"DejaVu Sans",Arial,sans-serif;fill:#edf7f4}.accent{fill:#fdb813}.muted{fill:#94aaa7}.green{fill:#70d49e}.red{fill:#ef5b68}.blue{fill:#69b7e7}.white{fill:#fff}.line{stroke:#fdb813;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#4c6866;stroke-width:2;fill:none}.dash{stroke:#fdb813;stroke-width:3;fill:none;stroke-dasharray:10 8}.card{fill:#091718;stroke:#2c4544;stroke-width:2}.board{fill:url(#pcb);stroke:#617473;stroke-width:3}.h1{font-size:48px;font-weight:850;letter-spacing:1px}.h2{font-size:28px;font-weight:800}.h3{font-size:22px;font-weight:800}.body{font-size:19px}.small{font-size:16px}.tag{font-size:15px;font-weight:800;letter-spacing:1.5px}.micro{font-size:13px;font-weight:700}
    </style>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg)"/>
  <text x="52" y="68" class="h1">OPENR4D10 · ECHTER HARDWARE-STACK</text>
  <text x="54" y="105" class="body muted">Komponentenkarte aus Herstelleransichten · kein erfundenes Gehäuse · keine Bohr- oder Maßschablone</text>

  <!-- Planned encoders: intentionally outside the present hardware cards. -->
  <rect x="52" y="138" width="1496" height="174" rx="28" class="card" stroke-dasharray="10 8"/>
  <text x="82" y="176" class="tag accent">GEPLANTE BEDIENELEMENTE · NOCH NICHT MONTIERT</text>
  <g transform="translate(150 205)">
    <circle cx="42" cy="40" r="40" class="dash"/>
    <circle cx="42" cy="40" r="22" class="thin"/>
    <path d="M42 0v14" class="line"/>
    <text x="104" y="24" class="h3">Linker ALPS-Doppelencoder</text>
    <text x="104" y="52" class="body"><tspan class="accent">außen</tspan> Lautstärke · <tspan class="accent">innen</tspan> Sekundärfunktion / SQL</text>
    <text x="104" y="79" class="small muted">Druck bewusst frei</text>
  </g>
  <g transform="translate(846 205)">
    <circle cx="42" cy="40" r="40" class="dash"/>
    <circle cx="42" cy="40" r="22" class="thin"/>
    <path d="M42 0v14" class="line"/>
    <text x="104" y="24" class="h3">Rechter ALPS-Doppelencoder</text>
    <text x="104" y="52" class="body"><tspan class="accent">außen</tspan> Kanal / Eintrag · <tspan class="accent">innen</tspan> Dienst</text>
    <text x="104" y="79" class="small muted">Druck Auswahl / Play · 2 s Quick-Menü</text>
  </g>
  <text x="800" y="298" text-anchor="middle" class="small muted">Vorgabe: oben, weit auseinander, innerhalb der Stackbreite · endgültige Position und GPIO erst nach realer Vermessung</text>

