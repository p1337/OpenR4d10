    <rect x="20" y="52" width="206" height="244" rx="31" fill="url(#screen)" stroke="#a3b6b3" stroke-width="3"/>
    <path d="M34 84H212M34 119H212" stroke="#375857" stroke-width="2"/>
    <text x="123" y="178" text-anchor="middle" class="h3 accent">240 × 280</text>
    <text x="123" y="207" text-anchor="middle" class="small muted">ST7789 LCD</text>
    <g fill="#617472"><rect x="32" y="323" width="21" height="11" rx="3"/><rect x="62" y="323" width="13" height="11" rx="3"/><rect x="83" y="323" width="13" height="11" rx="3"/><rect x="104" y="323" width="13" height="11" rx="3"/><rect x="136" y="319" width="46" height="39" rx="5"/><rect x="190" y="322" width="14" height="14" rx="3"/></g>
    <rect x="93" y="386" width="38" height="22" rx="4" fill="#b7c3c0" stroke="#657572" stroke-width="2"/>
    <text x="112" y="431" text-anchor="middle" class="micro muted">MIC_R</text>
  </g>
  <path d="M414 455H466V435" class="line"/><text x="338" y="434" class="small accent">RGB-LED oben</text>
  <path d="M298 849H112V881" class="line"/><text x="78" y="910" class="small">rechtes Mikrofon</text>
  <text x="78" y="948" class="small muted">Display und MIC_R sitzen auf der Frontplatine.</text>
  <text x="78" y="972" class="small muted">Keine Fronttasten · kein Touchscreen.</text>

