  <text x="588" y="972" class="small"><tspan class="accent">4</tspan> SP1/SP2 · <tspan class="accent">5</tspan> 8 Ω / 1 W · <tspan class="accent">6</tspan> 40-Pin-Buchse</text>

  <!-- Real stack order; no invented enclosure or button projection. -->
  <rect x="1072" y="338" width="476" height="648" rx="30" class="card"/>
  <text x="1098" y="379" class="tag accent">STACK · HEUTE VORHANDEN</text>
  <text x="1098" y="413" class="h2">Front → Mitte → Rückseite</text>
  <g>
    <polygon points="1124,505 1372,455 1470,500 1222,550" fill="#19292a" stroke="#91aaa6" stroke-width="3"/>
    <rect x="1170" y="472" width="190" height="49" rx="12" fill="#143134" stroke="#a7bcba" stroke-width="2" transform="rotate(-11 1170 472)"/>
    <text x="1098" y="582" class="h3">1 · Whisplay HAT</text><text x="1098" y="608" class="small muted">Front: Display, Audio, PTT</text>

    <polygon points="1142,670 1390,620 1488,665 1240,715" fill="url(#pi)" stroke="#70d49e" stroke-width="3"/>
    <rect x="1366" y="638" width="56" height="24" rx="4" fill="#c8d0cd"/><rect x="1422" y="658" width="43" height="22" rx="4" fill="#c8d0cd"/>
    <text x="1098" y="747" class="h3">2 · Raspberry Pi Zero 2 W</text><text x="1098" y="773" class="small muted">Mitte · USB-Seite = Whisplay-PTT-Seite</text>

    <polygon points="1160,835 1408,785 1506,830 1258,880" fill="#202829" stroke="#7e908e" stroke-width="3"/>
    <polygon points="1200,841 1376,805 1445,836 1269,872" fill="url(#battery)" stroke="#586865" stroke-width="2"/>
