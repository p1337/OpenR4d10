# Whisplay and the read-only PiSugar 3 percentage adapter use the verified
# profiles documented in docs/HARDWARE.md.

[display]
backend = "whisplay"
# Development alternatives: "file", "command" or "unconfigured".
# output_path = "/run/openr4d10/display.json"
# command = ["/absolute/path/to/whisplay-helper", "render"]
# timeout_seconds = 2.0

[power]
backend = "pisugar3"
# Generic alternatives: "command" or "unconfigured".
# command = ["/absolute/path/to/pisugar-helper", "status-json"]
# timeout_seconds = 2.0

[receiver]
backend = "system"
# Generic alternative: "command".
# command = ["/absolute/path/to/receiver-helper", "status-json"]
# timeout_seconds = 2.0
