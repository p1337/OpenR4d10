# Whisplay uses the verified ST7789 profile documented in docs/HARDWARE.md.
# PiSugar telemetry deliberately remains unconfigured until its API is verified.

[display]
backend = "whisplay"
# Development alternatives: "file", "command" or "unconfigured".
# output_path = "/run/openr4d10/display.json"
# command = ["/absolute/path/to/whisplay-helper", "render"]
# timeout_seconds = 2.0

[power]
backend = "unconfigured"
# Generic choice: "command".
# command = ["/absolute/path/to/pisugar-helper", "status-json"]
# timeout_seconds = 2.0

[receiver]
backend = "system"
# Generic alternative: "command".
# command = ["/absolute/path/to/receiver-helper", "status-json"]
# timeout_seconds = 2.0
