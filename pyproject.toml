[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openr4d10"
version = "0.10.57"
description = "Hardware-safe Raspberry Pi receiver UI service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=11,<13"]

[project.scripts]
openr4d10 = "openr4d10.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
